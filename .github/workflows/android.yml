name: Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # main 에 올라가면 GitHub Release(업데이트 파일)를 만든다

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 빌드할 때마다 1씩 올라가는 번호 = 앱 버전 번호
      APP_VERSION_CODE: ${{ github.run_number }}
      IS_RELEASE: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "서명 열쇠를 찾았습니다."
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 시크릿이 없습니다. 저장소 Settings > Secrets and variables > Actions 에 서명 열쇠 4개를 넣어 주세요."
            exit 1
          else
            echo "서명 열쇠 없이 검사용으로만 빌드합니다."
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "JoAjeossiTranslator-v${APP_VERSION_CODE}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoAjeossiTranslator-apk
          path: JoAjeossiTranslator-v${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release (앱 자동 업데이트용)
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${APP_VERSION_CODE}" "JoAjeossiTranslator-v${APP_VERSION_CODE}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "버전 1.0.${APP_VERSION_CODE}" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest
